<div>
  <div class="px-8 py-8">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="font-semibold text-text-muted">TENTATIVAS · RETOMAR</h1>
        <h1 class="text-3xl font-bold pt-2">Tentativas Pendentes</h1>
        <p class="text-text-muted text-sm py-4 w-2/3">Consulte todas as tentativas pendentes registrados, com filtros
          por
          status, janela de horário, número da
          tentativa e período.</p>
      </div>
      <div>
        <button (click)="openModal()"
          class="cursor-pointer bg-primary !font-semibold text-white text-lg rounded-xl w-48 h-12">
          Nova Tentativa
        </button>
      </div>
    </div>
    <div class="flex flex-col gap-6">
      <app-diligences-filtered-search></app-diligences-filtered-search>
      <app-diligences-entries [currentPage]="diligencesCurrentPage()" [pageSize]="diligencesPageSize()"
        [totalPages]="diligencesTotalPages()" (updateCurrentPage)="onUpdateDiligencesCurrentPage($event)"
        [isLoading]="isDiligencesLoading()" [diligences]="diligences()" [hasMorePages]="diligencesHasNext()"
        [hasPreviousPages]="diligencesHasPrevious()" (nextPage)="onUpdateDiligencesCurrentPage($event)"
        (previousPage)="onUpdateDiligencesCurrentPage($event)"></app-diligences-entries>
      <app-attempts-with-no-diligences-entries [currentPage]="pendingAttemptsCurrentPage()"
        [pageSize]="pendingAttemptsPageSize()" [totalPages]="pendingAttemptsTotalPages()"
        (updateCurrentPage)="onUpdatePendingAttemptsCurrentPage($event)" [hasMorePages]="pendingAttemptsHasNext()"
        [hasPreviousPages]="pendingAttemptsHasPrevious()" (nextPage)="onUpdatePendingAttemptsCurrentPage($event)"
        (previousPage)="onUpdatePendingAttemptsCurrentPage($event)" [isLoading]="isPendingAttemptsLoading()"
        [attempts]="pendingAttempts()"></app-attempts-with-no-diligences-entries>
    </div>
  </div>
</div>
