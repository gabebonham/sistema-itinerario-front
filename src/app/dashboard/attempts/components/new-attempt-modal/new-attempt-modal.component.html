<div class="w-full flex flex-col p-8 gap-4 justify-between h-full border-1 border-border">
    <form [formGroup]="form" class="w-full flex flex-col gap-4">
        <div>
            <h1 class="text-xl">Criar nova Tentativa</h1>
        </div>
        <div class="flex flex-col gap-6">
            <mat-form-field appearance="outline" class="!w-full" floatLabel="always">
                <mat-label>Agente</mat-label>
                <input matInput type="text" formControlName="agent" placeholder="Nome do agente..." maxlength="10" class="!text-xs" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="!w-full" floatLabel="always">
                <mat-label>Devedor</mat-label>
                <input matInput type="text" formControlName="debtor" placeholder="Nome do devedor..." maxlength="10" class="!text-xs" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="!w-full" floatLabel="always">
                <mat-label>ID do contrato</mat-label>
                <input matInput type="text" formControlName="contractId" placeholder="ID do contrato..." maxlength="10" class="!text-xs" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="!w-full" floatLabel="always">
                <mat-label>Parcelas em atraso</mat-label>
                <input matInput type="text" formControlName="installmentsNumber" placeholder="Nº de parcelas..." maxlength="10" class="!text-xs" />
            </mat-form-field>
        </div>
    </form>

    <div>
        @if (errors.length > 0) {
            @for (error of errors; track error) {
                <p class="text-error">{{error}}</p>
            }
        } @else if (isLoading) {
            <div class="flex items-center justify-center w-full h-full p-4">
                <div class="spinner"></div>
            </div>
        }
    </div>

    <div class="flex items-center justify-end gap-8">
        <button (click)="cancel()"
            class="cursor-pointer bg-white border-1 border-error !font-semibold text-error !text-md rounded-lg w-42 h-10">
            Cancelar</button>
        <button (click)="confirm()" [disabled]="isLoading"
            class="cursor-pointer bg-primary !font-semibold text-white !text-md rounded-lg w-42 h-10 disabled:opacity-50">
            Criar</button>
    </div>
</div>
