<form (ngSubmit)="login()"  [formGroup]="loginForm" class=" flex flex-col gap-4 bg-background">

    <div class="py-4">
        <h1 class="text-xl text-quarternary">Bem vindo(a) de volta</h1>
        <p class="text-text-muted">Entre com suas credenciais.</p>
    </div>
    <div>
        <div class="flex flex-col gap-6">
            <mat-form-field appearance="outline" floatLabel="always">
                <mat-label>Email</mat-label>
                <mat-icon matPrefix class="text-gray-400 !text-lg ">mail</mat-icon>
                <input   autocapitalize="none" formControlName="email" matInput type="text" placeholder="Seu email..." class="!placeholder-text-muted !text-xs" />
            </mat-form-field>
            <mat-form-field appearance="outline" floatLabel="always">
                <mat-label>Senha</mat-label>
                <mat-icon matPrefix class="text-gray-400 !text-lg ">lock</mat-icon>
                @if (showPassword()) {

                <mat-icon (click)="toggleShowPassword()" matSuffix class="text-gray-400 !text-lg cursor-pointer">visibility_off</mat-icon>
                } @else {
                <mat-icon (click)="toggleShowPassword()" matSuffix class="text-gray-400 !text-lg cursor-pointer">visibility</mat-icon>

                }
                <input formControlName="password" matInput [type]="showPassword()?'text':'password'"
                    placeholder="Sua senha..." class="!text-xs !placeholder-text-muted " />
            </mat-form-field>
        </div>
    </div>
    <div>
        <button type="submit" [disabled]="isLoading()"
            class="cursor-pointer bg-primary !font-semibold text-white !text-md rounded-lg w-full h-10 disabled:opacity-50">
            Entrar</button>
    </div>
</form>
