<div>
    <mat-sidenav-container class="h-screen">
        <mat-sidenav mode="side" [opened]="sidenavOpened" [style.width]="'256px !important'" [style.border]="'0px'"
            [style.border-radius]="'0px !important'">
            <div class="bg-text-black flex flex-col items-start justify-between h-full w-full">
                <div class="p-3.5 border-b-1 border-border w-full">
                    <h1 class="text-xl !text-white">{{ appName }}</h1>
                </div>
                <div class=" h-full rounded-none w-full">

                    <nav class="flex flex-col gap-1 p-4 w-full">
                        @for (section of sections; track section.name) {
                            <a (click)="changeSection(section)" class="cursor-pointer">
                        @if (section.name === dashboardState.activeSection().name) {
                        <span 
                            class="flex items-center gap-2 bg-primary/20 p-2 rounded-md text-surface/80 border-l-3 border-l-primary !font-bold">

                            <mat-icon class="!text-base !w-4 !h-4 !leading-4 flex items-center justify-center">
                                {{ section.icon }}
                            </mat-icon>

                            {{ section.name }}
                        </span>
                        } @else {
                        <div class="flex items-center gap-2  text-secondary p-2 rounded-md">

                            <mat-icon class="!text-base !w-4 !h-4 !leading-4 flex items-center justify-center">
                                {{ section.icon }}
                            </mat-icon>

                            {{ section.name }}
                        </div>
                        }</a>
                        }
                    </nav>
                </div>
                <div class="p-4 flex items-center justify-between w-full">
                    <div class=" flex items-center gap-2">
                        <mat-icon class="!text-white/70 bg-primary p-2 box-content rounded-full">person</mat-icon>
                        <div>
                            <h1 class="text-white">{{currentUser()?.username}}</h1>
                            <p class="text-text-muted">{{currentUser()?.role}}</p>
                        </div>
                    </div>
                    <mat-icon
                        class="text-white cursor-pointer duration-100 transition-color hover:!text-primary">logout</mat-icon>

                </div>
            </div>
        </mat-sidenav>

        <mat-sidenav-content class="bg-background">
            <app-dashboard-header [breadCrumbs]="dashboardState.breadCrumbs()"
                (toggleSidenav)="toggleSidenav()"></app-dashboard-header>
            <router-outlet />
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
