<div class="bg-white rounded-xl border-1 border-border p-5 shadow-lg">
  <div class="pb-6 flex flex-col hap-4">
    <div class="flex items-center gap-4">
      <mat-icon class="!text-text-muted !text-lg !h-7">badge</mat-icon>
      <h1 class="text-lg font-bold text-text-black">Notificadores Registrados</h1>
    </div>
    <p class="!text-text-muted !text-xs">Administre os notificadores registrados.</p>
  </div>
  @if (isLoading()) {
  <div class="flex flex-col gap-3">
    <div class="flex items-center justify-center w-full h-full p-4">
      <div class="spinner"></div>
    </div>
  </div>
  } @else if (!isLoading() && notificatorEntries().length == 0) {
  <div class="flex flex-col gap-3">
    <div class="flex justify-center items-center pb-4">
      <h1>Sem registros...</h1>
    </div>
  </div>
  } @else if (!isLoading() && notificatorEntries().length != 0) {
  <div class="flex grid grid-cols-2 gap-3">
    @for (item of notificatorEntries(); track item.id) {
    <app-notificator-entry (delete)="deleteNotificator($event)" [email]="item.email" [id]="item.id" [name]="item.name" [createdAt]="item.createdAt"></app-notificator-entry>
    }
  </div>
  }

</div>
