<div class="relative w-full h-full overflow-hidden rounded-xl border-1 border-border shadow-lg">

    <div class="flex items-center gap-4 bg-gradient-to-r from-quarternary to-primary px-6 py-4">

        <mat-icon class="!text-white p-4 bg-text-muted rounded-full box-content">
            person
        </mat-icon>

        <div>
            <p class="text-text-muted !font-bold">
                DEVEDOR
            </p>

            <h1 class="!text-white text-xl">
                {{ debtor()?.name }}
            </h1>
        </div>

    </div>

    @if (mapsReady()) {

    <google-map height="500px" width="100%" [center]="destination()!" [zoom]="16">

        @if (destination(); as destination) {
        <map-marker [position]="destination" title="Endereço">
        </map-marker>
        }

    </google-map>

    }

</div>
